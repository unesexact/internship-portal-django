<h1>{{ internship.title }}</h1>

<p><strong>Company:</strong> {{ internship.company.username }}</p>
<p><strong>Location:</strong> {{ internship.location }}</p>
<p><strong>Status:</strong> {{ internship.status }}</p>

<hr>

<p>{{ internship.description }}</p>

<!-- 🟢 APPLY BUTTON -->
{% if user.is_authenticated and user.profile.user_type == "student" %}
    <a href="{% url 'apply' internship.id %}">
        Apply Now
    </a>
{% endif %}

<hr>

<a href="{% url 'internship_list' %}">← Back to list</a>
