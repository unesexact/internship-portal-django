<!DOCTYPE html>
<html>
<head>
    <title>Internship Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="#">InternPortal</a>

    <div class="ms-auto">

        {% if user.is_authenticated %}

            {% if user.profile.user_type == "student" %}
                <a class="btn btn-outline-light btn-sm" href="/users/dashboard/">Dashboard</a>
                <a class="btn btn-outline-light btn-sm" href="/users/profile/">Profile</a>
            {% elif user.profile.user_type == "company" %}
                <a class="btn btn-outline-light btn-sm" href="/users/dashboard/">Dashboard</a>
                <a class="btn btn-outline-light btn-sm" href="/users/profile/">Profile</a>
            {% endif %}

            <a class="btn btn-danger btn-sm" href="/users/logout/">Logout</a>

        {% else %}

            <a class="btn btn-outline-light btn-sm" href="/users/login/">Login</a>
            <a class="btn btn-success btn-sm" href="/users/register/">Register</a>

        {% endif %}

    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
